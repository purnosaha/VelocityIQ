services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: velocityiq-app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      - DUCKDB_PATH=/app/data/velocityiq.duckdb
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:7b
    depends_on:
      duckdb:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  duckdb:
    build:
      context: .
      dockerfile: Dockerfile.duckdb
    container_name: velocityiq-duckdb
    volumes:
      - ./data:/data
    environment:
      - DUCKDB_PATH=/data/velocityiq.duckdb
    restart: on-failure

  ollama:
    image: ollama/ollama:latest
    container_name: velocityiq-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: velocityiq-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:7b
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "echo 'Pulling model: '$$OLLAMA_MODEL &&
       ollama pull $$OLLAMA_MODEL &&
       echo 'Model pull complete.'"
    restart: "no"

volumes:
  ollama_models:
