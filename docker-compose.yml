services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: velocityiq-app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - duckdb-data:/app/data
    environment:
      - DUCKDB_PATH=/app/data/velocityiq.duckdb
    depends_on:
      - duckdb
    restart: unless-stopped

  duckdb:
    build:
      context: .
      dockerfile: Dockerfile.duckdb
    container_name: velocityiq-duckdb
    volumes:
      - duckdb-data:/data
    environment:
      - DUCKDB_PATH=/data/velocityiq.duckdb
    restart: unless-stopped

volumes:
  duckdb-data:
